<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DockWeb">
  <meta name="theme-color" content="#09090b">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icon.png">
  <title>DockWeb</title>
  <style>
    :root {
      --bg: #09090b;
      --card-bg: rgba(255, 255, 255, 0.05);
      --border: rgba(255, 255, 255, 0.1);
      --accent: #3b82f6;
      --text: #f4f4f5;
      --subtext: #a1a1aa;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }
    .viewport {
      display: flex;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
    }
    .viewport::-webkit-scrollbar { display: none; }
    .page {
      flex: 0 0 100%;
      width: 100%;
      height: 100%;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      padding: env(safe-area-inset-top) max(16px, env(safe-area-inset-right), calc((100% - 1000px) / 2))
               calc(env(safe-area-inset-bottom) + 40px) max(16px, env(safe-area-inset-left), calc((100% - 1000px) / 2));
      overflow-y: auto;
      scrollbar-width: none;
    }
    .page::-webkit-scrollbar { display: none; }
    .narrow { max-width: 560px; margin: 0 auto; }
    .header {
      padding: 16px 0 12px;
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--subtext);
    }
    .empty { color: var(--subtext); font-size: 14px; }

    /* Page 1: Dock */
    /* Columns follow the screen width: 4 on a portrait phone, 7-8 in landscape, more on tablets. */
    .dock-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(76px, 1fr));
      gap: 10px;
    }
    .dock-sep {
      grid-column: 1 / -1;
      font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--subtext); padding: 8px 2px 0; border-top: 1px solid var(--border); margin-top: 4px;
    }
    .dock-tile {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 0;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 10px 4px 14px;
      position: relative;
      touch-action: pan-x pan-y;
      transition: transform 0.12s, background 0.12s;
    }
    .dock-tile.pressed { transform: scale(0.93); background: rgba(255,255,255,0.12); }
    .dock-tile .ic {
      display: block; width: 78%; max-width: 72px; aspect-ratio: 1 / 1; height: auto;
      object-fit: contain; pointer-events: none; flex: none;
    }
    .dock-tile .ph { background: rgba(255,255,255,0.1); border-radius: 22%; transform: scale(0.82); }
    .dock-tile span {
      font-size: 11px; color: var(--subtext); margin-top: 4px; line-height: 1.3;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%;
      pointer-events: none;
    }
    .status-dot {
      position: absolute; bottom: 5px; width: 4px; height: 4px;
      border-radius: 50%; background: transparent;
    }
    .status-dot.active { background: #fff; }
    .hint { margin-top: 16px; font-size: 12px; color: var(--subtext); line-height: 1.6; }

    /* Page 2: Controls */
    .card-section { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
    .btn-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    /* Page 1 tiles follow the dock tiles: icon on top, small label underneath */
    .btn-row button { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; border-radius: 18px; padding: 14px 4px 12px; }
    .btn-row button svg { width: 30px; height: 30px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
    .btn-row button svg .f { fill: currentColor; stroke: none; }
    .btn-row .lbl { font-size: 11px; color: var(--subtext); line-height: 1.3; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none; }
    .btn-row button.danger .lbl { color: var(--danger); }
    .btn-row button.armed .lbl { color: #fff; }
    button {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 12px;
      padding: 16px 8px;
      font-size: 14px;
      font-weight: 500;
      font-family: inherit;
    }
    button:active { background: rgba(255, 255, 255, 0.15); }
    button.danger { color: var(--danger); }
    button.armed { background: var(--danger); color: #fff; border-color: var(--danger); }

    /* Page 3: Folders + drives */
    .place-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-bottom: 8px; }
    .place-grid button { display: flex; align-items: center; gap: 10px; text-align: left; padding: 14px 12px; min-width: 0; }
    .place-grid .pt { display: flex; flex-direction: column; min-width: 0; }
    .place-grid .pt b, .place-grid .pt small { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .place-grid .pt b { font-weight: 500; }
    .place-grid .pt small { font-size: 11px; color: var(--subtext); margin-top: 2px; }
    .place-grid .pi { font-size: 20px; line-height: 1; flex: none; }
    .volume-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
    .volume-card {
      display: flex; align-items: center; gap: 6px; min-width: 0; cursor: pointer;
      background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 4px 4px 4px 12px;
    }
    .volume-card:active { background: rgba(255,255,255,0.15); }
    .volume-name { flex: 1; min-width: 0; font-weight: 500; font-size: 14px; padding: 10px 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .volume-card .eject { flex: none; width: 40px; height: 40px; padding: 0; border-radius: 10px; font-size: 16px; color: var(--subtext); }
    .volume-list .empty { grid-column: 1 / -1; }

    /* Page 4: Interface */
    .switch-list { display: flex; flex-direction: column; background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
    .switch-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; font-size: 15px; }
    .switch-row + .switch-row { border-top: 1px solid var(--border); }
    .switch-row small { display: block; color: var(--subtext); font-size: 12px; margin-top: 2px; }
    .switch-row input { appearance: none; -webkit-appearance: none; flex: none; width: 46px; height: 28px; border-radius: 14px; background: rgba(255,255,255,0.18); position: relative; transition: background 0.2s; margin: 0; }
    .switch-row input::after { content: ''; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform 0.2s; }
    .switch-row input:checked { background: var(--accent); }
    .switch-row input:checked::after { transform: translateX(18px); }

    .gestures { background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; font-size: 14px; line-height: 1.5; }

    /* Interface options */
    body.no-titles .header.sec { display: none; }
    body.no-titles .dock-sep { font-size: 0; padding: 0; margin: 4px 0; }
    body.no-titles .page { padding-top: calc(env(safe-area-inset-top) + 16px); }
    body.no-labels .dock-tile span, body.no-labels .btn-row .lbl { display: none; }
    body.no-labels .dock-tile { padding-bottom: 10px; }
    body.no-markers .status-dot { display: none; }

    /* Page dots */
    .dots {
      position: fixed; left: 0; right: 0;
      bottom: calc(env(safe-area-inset-bottom) + 10px);
      display: flex; justify-content: center; gap: 4px;
    }
    .dots i { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.25); background-clip: content-box; padding: 8px; box-sizing: content-box; cursor: pointer; }
    .viewport.dragging { cursor: grabbing; }
    .dock-tile { cursor: pointer; }
    .dots i.on { background-color: #fff; }

    /* Toast */
    .toast {
      position: fixed; top: calc(env(safe-area-inset-top) + 8px); left: 50%;
      transform: translate(-50%, -80px); background: #27272a; border: 1px solid var(--border);
      padding: 10px 16px; border-radius: 999px; font-size: 13px; transition: transform 0.25s;
      max-width: 90vw; z-index: 20;
    }
    .toast.show { transform: translate(-50%, 0); }

    /* Login */
    .login {
      position: fixed; inset: 0; background: var(--bg); z-index: 10;
      display: none; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 24px;
    }
    .login.show { display: flex; }
    .login h1 { margin: 0; font-size: 22px; font-weight: 600; }
    .login p { margin: 0; color: var(--subtext); font-size: 14px; text-align: center; }
    .login input {
      width: 220px; text-align: center; font-size: 28px; letter-spacing: 0.4em;
      padding: 12px; border-radius: 14px; border: 1px solid var(--border);
      background: var(--card-bg); color: var(--text); font-family: inherit;
    }
    .login input:focus { outline: 2px solid var(--accent); }
    .login button { width: 220px; background: var(--accent); border-color: var(--accent); }
    .login .err { color: var(--danger); min-height: 18px; }
  </style>
</head>
<body>
  <div class="viewport" id="viewport">
    <div class="page"><div class="narrow">
      <div class="header sec">Media</div>
      <div class="card-section">
        <div class="btn-row">
          <button data-sys="prev" data-icon="prev">Previous</button>
          <button data-sys="playpause" data-icon="playpause">Play/Pause</button>
          <button data-sys="next" data-icon="next">Next</button>
          <button data-sys="mute" data-icon="mute">Mute</button>
          <button data-sys="voldown" data-icon="voldown">Volume −</button>
          <button data-sys="volup" data-icon="volup">Volume +</button>
          <button data-sys="displaysleep" data-icon="display">Display Sleep</button>
          <button data-sys="bridown" data-icon="bridown">Brightness −</button>
          <button data-sys="briup" data-icon="briup">Brightness +</button>
        </div>
      </div>

      <div class="header sec">Power &amp; Session</div>
      <div class="card-section">
        <div class="btn-row">
          <button data-sys="sleep" data-icon="sleep">Sleep</button>
          <button class="danger" data-sys="restart" data-icon="restart" data-confirm>Restart</button>
          <button class="danger" data-sys="shutdown" data-icon="shutdown" data-confirm>Shut Down</button>
          <button class="danger" data-sys="logout" data-icon="logout" data-confirm>Log Out</button>
        </div>
      </div>
    </div></div>

    <div class="page">
      <div class="header sec">Dock</div>
      <div class="dock-grid" id="dock-grid"></div>
    </div>

    <div class="page">
      <div class="header sec">Folders</div>
      <div class="place-grid" id="place-grid"></div>
      <div class="header sec">External Drives</div>
      <div class="volume-list" id="volume-list"></div>
    </div>

    <div class="page"><div class="narrow">
      <div class="header">Interface</div>
      <div class="switch-list">
        <label class="switch-row"><span>Hide section titles<small>Dock, Open, Media, Power &amp; Session, Folders, External Drives</small></span><input type="checkbox" data-ui="no-titles"></label>
        <label class="switch-row"><span>Hide icon labels<small>Text under the icons on the Media and Dock pages</small></span><input type="checkbox" data-ui="no-labels"></label>
        <label class="switch-row"><span>Hide running markers<small>The dot under open apps</small></span><input type="checkbox" data-ui="no-markers"></label>
      </div>
      <div class="hint">These settings are stored on this phone.</div>
      <div class="header">Dock gestures</div>
      <div class="gestures">Tap: 1 activate / hide • 2 exposé • 3 quit. Hold: full screen.</div>
    </div></div>
  </div>

  <div class="dots" id="dots"><i></i><i class="on"></i><i></i><i></i></div>
  <div class="toast" id="toast"></div>

  <form class="login" id="login">
    <h1>DockWeb</h1>
    <p>Enter the PIN from the DockWeb menu-bar icon on your Mac</p>
    <input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="12" aria-label="PIN">
    <div class="err" id="login-err"></div>
    <button type="submit">Unlock</button>
  </form>

  <script>
    const $ = id => document.getElementById(id);

    // ------------------------------------------------------------ api
    let authed = false;
    const loginEl = $('login');

    function showLogin(msg = '') {
      authed = false;
      $('login-err').textContent = msg;
      loginEl.classList.add('show');
    }

    async function api(url, data) {
      const opts = data === undefined ? {} : {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data)
      };
      let res;
      try { res = await fetch(url, opts); }
      catch { throw new Error("Can't reach the Mac. Is server.js running?"); }
      if (res.status === 401 && url !== '/api/login') { showLogin(); throw new Error('unauthorized'); }
      const body = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(body.error || res.statusText);
      return body;
    }

    let toastTimer;
    function toast(msg) {
      const t = $('toast');
      t.textContent = msg; t.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
    }
    function act(url, data) {
      if (navigator.vibrate) navigator.vibrate(10);
      return api(url, data).catch(e => { if (e.message !== 'unauthorized') toast(e.message); });
    }

    loginEl.addEventListener('submit', async e => {
      e.preventDefault();
      try {
        await api('/api/login', { pin: $('pin').value });
        $('pin').value = '';
        loginEl.classList.remove('show');
        start();
      } catch (err) {
        $('login-err').textContent = err.message;
        $('pin').value = '';
      }
    });

    // ------------------------------------------------------------ system buttons
    const SPEAKER = '<path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/>';
    const SUN_RAYS = r => [0, 45, 90, 135, 180, 225, 270, 315].map(d => `<path d="M12 ${12 - r - 1.5}v-${r > 6 ? 2.5 : 1.5}" transform="rotate(${d} 12 12)"/>`).join('');
    const ICONS = {
      playpause: '<path class="f" d="M4 5.5v13l9-6.5z"/><path d="M16 6v12M20 6v12"/>',
      prev: '<path class="f" d="M19 5.5v13L10 12z"/><path d="M6 6v12"/>',
      next: '<path class="f" d="M5 5.5v13l9-6.5z"/><path d="M18 6v12"/>',
      mute: SPEAKER + '<path d="M16 9.5l5 5M21 9.5l-5 5"/>',
      voldown: SPEAKER + '<path d="M15.5 9.5a3.5 3.5 0 0 1 0 5"/>',
      volup: SPEAKER + '<path d="M15.5 9.5a3.5 3.5 0 0 1 0 5M18.5 6.5a7.5 7.5 0 0 1 0 11"/>',
      display: '<rect x="3" y="4.5" width="18" height="12" rx="2"/><path d="M9 20h6M12 16.5V20"/><path d="M13.6 8.2a2.6 2.6 0 1 0 2.2 3.4 2.1 2.1 0 0 1-2.2-3.4z"/>',
      bridown: '<circle cx="12" cy="12" r="3"/>' + SUN_RAYS(4),
      briup: '<circle cx="12" cy="12" r="4"/>' + SUN_RAYS(7),
      sleep: '<path d="M19.5 14.5A8 8 0 1 1 9.5 4.5a6.5 6.5 0 0 0 10 10z"/>',
      restart: '<path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 4v4.5h-4.5"/>',
      shutdown: '<path d="M12 3.5v8"/><path d="M6.6 6.8a7.5 7.5 0 1 0 10.8 0"/>',
      logout: '<path d="M14 4.5h4a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2h-4"/><path d="M9 8l-4 4 4 4M5 12h10"/>'
    };
    document.querySelectorAll('[data-icon]').forEach(btn => {
      const label = btn.textContent;
      btn.setAttribute('aria-label', label);
      btn.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[btn.dataset.icon]}</svg><span class="lbl"></span>`;
      btn.querySelector('.lbl').textContent = label;
    });

    document.querySelectorAll('[data-sys]').forEach(btn => {
      let armTimer;
      const lbl = btn.querySelector('.lbl'), label = lbl.textContent;
      const disarm = () => { btn.classList.remove('armed'); lbl.textContent = label; };
      btn.addEventListener('click', () => {
        const command = btn.dataset.sys;
        if (btn.hasAttribute('data-confirm')) {
          if (!btn.classList.contains('armed')) {
            btn.classList.add('armed');
            lbl.textContent = 'Tap to confirm';
            armTimer = setTimeout(disarm, 3000);
            return;
          }
          clearTimeout(armTimer); disarm();
          act('/api/system/action', { command, confirm: true });
          return;
        }
        act('/api/system/action', { command });
      });
    });

    // ------------------------------------------------------------ interface options (per phone)
    document.querySelectorAll('[data-ui]').forEach(box => {
      const cls = box.dataset.ui, key = 'dw-' + cls;
      try { box.checked = localStorage.getItem(key) === '1'; } catch {}
      document.body.classList.toggle(cls, box.checked);
      box.addEventListener('change', () => {
        document.body.classList.toggle(cls, box.checked);
        try { localStorage.setItem(key, box.checked ? '1' : ''); } catch {}
      });
    });

    // ------------------------------------------------------------ dock + gestures
    const grid = $('dock-grid');
    const tiles = new Map(); // id -> element

    function makeTile(app) {
      const tile = document.createElement('div');
      tile.className = 'dock-tile';
      const icon = makeIcon(app);
      const label = document.createElement('span');
      label.textContent = app.label;
      const dot = document.createElement('div');
      dot.className = 'status-dot';
      tile.append(icon, label, dot);
      attachGestures(tile, app.id);
      return tile;
    }

    function makeIcon(app) {
      if (!app.iconUrl) return Object.assign(document.createElement('div'), { className: 'ic ph' });
      return Object.assign(document.createElement('img'), { className: 'ic', src: app.iconUrl, alt: '', draggable: false });
    }

    // 1 tap: bring to front · 2 taps: App Exposé · 3 taps: quit · hold: full screen
    const TAP_GAP_MS = 280, HOLD_MS = 500, MOVE_PX = 12;
    const TAP_ACTIONS = [null, 'select', 'expose', 'quit'];

    function attachGestures(tile, id) {
      let startX = 0, startY = 0, holdTimer = null, held = false, down = false, taps = 0, tapTimer = null;
      const send = action => act('/api/dock/action', { action, id });

      tile.addEventListener('pointerdown', e => {
        down = true; held = false;
        startX = e.clientX; startY = e.clientY;
        tile.classList.add('pressed');
        clearTimeout(tapTimer);
        holdTimer = setTimeout(() => {
          held = true; holdTimer = null; taps = 0;
          tile.classList.remove('pressed');
          send('fullscreen');
        }, HOLD_MS);
      });

      tile.addEventListener('pointermove', e => {
        if (!down || !holdTimer) return;
        if (Math.hypot(e.clientX - startX, e.clientY - startY) > MOVE_PX) cancel(true);
      });

      const cancel = (moved = false) => {
        down = false; clearTimeout(holdTimer); holdTimer = null;
        tile.classList.remove('pressed');
        if (moved) taps = 0; // it was a scroll, not a tap
      };
      tile.addEventListener('pointercancel', () => cancel(true));
      tile.addEventListener('contextmenu', e => e.preventDefault());

      tile.addEventListener('pointerup', e => {
        if (!down) return;
        const moved = Math.hypot(e.clientX - startX, e.clientY - startY) > MOVE_PX;
        cancel(moved);
        if (held || moved) return;
        taps = Math.min(taps + 1, 3);
        const fire = () => { const a = TAP_ACTIONS[taps]; taps = 0; if (a) send(a); };
        if (taps === 3) fire(); else tapTimer = setTimeout(fire, TAP_GAP_MS);
      });
    }

    const sep = Object.assign(document.createElement('div'), { className: 'dock-sep', textContent: 'Open' });

    async function loadDock() {
      const apps = await api('/api/dock');
      const order = [];
      apps.forEach(app => {
        let tile = tiles.get(app.id);
        if (!tile) { tile = makeTile(app); tiles.set(app.id, tile); }
        else if (app.iconUrl && tile.firstChild.getAttribute('src') !== app.iconUrl) tile.replaceChild(makeIcon(app), tile.firstChild); // new render (appearance changed)
        tile.querySelector('.status-dot').classList.toggle('active', app.isRunning);
        if (!app.pinned && !order.includes(sep)) order.push(sep);
        order.push(tile);
      });
      const ids = new Set(apps.map(a => a.id));
      for (const [id, tile] of tiles) if (!ids.has(id)) { tile.remove(); tiles.delete(id); }
      if (!order.includes(sep)) sep.remove();
      order.forEach((el, i) => { if (grid.children[i] !== el) grid.insertBefore(el, grid.children[i] || null); });
      grid.querySelector('.empty')?.remove();
      if (!apps.length) grid.innerHTML = '<div class="empty">No dock apps found.</div>';
    }

    // ------------------------------------------------------------ volumes
    let volSig = '';
    async function loadVolumes() {
      const vols = await api('/api/volumes');
      const sig = JSON.stringify(vols);
      if (sig === volSig) return;
      volSig = sig;
      const list = $('volume-list');
      list.replaceChildren();
      if (!vols.length) {
        const d = document.createElement('div');
        d.className = 'empty'; d.textContent = 'No external drives detected.';
        list.append(d); return;
      }
      for (const vol of vols) {
        const card = document.createElement('div'); card.className = 'volume-card'; card.title = 'Open in Finder on the Mac';
        const name = document.createElement('div'); name.className = 'volume-name'; name.textContent = vol.name;
        const eject = Object.assign(document.createElement('button'), { className: 'eject', textContent: '⏏︎', title: 'Eject' });
        eject.setAttribute('aria-label', 'Eject ' + vol.name);
        card.addEventListener('click', () => act('/api/volumes/action', { action: 'open', name: vol.name }).then(r => r && toast(`Opened ${vol.name} on the Mac`)));
        eject.addEventListener('click', async e => {
          e.stopPropagation();
          eject.disabled = true;
          await act('/api/volumes/action', { action: 'eject', name: vol.name });
          loadVolumes().catch(() => {});
        });
        card.append(name, eject); list.append(card);
      }
    }

    // ------------------------------------------------------------ folders
    const PLACE_ICONS = { desktop: '🖥️', documents: '📄', downloads: '⬇️', icloud: '☁️', gdrive: '🟢', onedrive: '🔷' };
    let placeSig = '';
    async function loadPlaces() {
      const places = await api('/api/places');
      const sig = JSON.stringify(places);
      if (sig === placeSig) return;
      placeSig = sig;
      $('place-grid').replaceChildren(...places.map(p => {
        const b = document.createElement('button');
        b.title = 'Open in Finder on the Mac';
        const text = Object.assign(document.createElement('span'), { className: 'pt' });
        text.append(Object.assign(document.createElement('b'), { textContent: p.name }));
        if (p.sub) text.append(Object.assign(document.createElement('small'), { textContent: p.sub }));
        b.append(Object.assign(document.createElement('span'), { className: 'pi', textContent: PLACE_ICONS[p.kind] || '📁' }), text);
        b.addEventListener('click', () => act('/api/places/action', { id: p.id }).then(r => r && toast(`Opened ${p.name} on the Mac`)));
        return b;
      }));
    }

    // ------------------------------------------------------------ page dots + mouse navigation
    const viewport = $('viewport');
    const pageCount = viewport.children.length;
    const goTo = i => viewport.scrollTo({ left: Math.max(0, Math.min(pageCount - 1, i)) * viewport.clientWidth, behavior: 'smooth' });
    const currentPage = () => Math.round(viewport.scrollLeft / viewport.clientWidth);

    [...$('dots').children].forEach((d, i) => d.addEventListener('click', () => goTo(i)));
    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight') goTo(currentPage() + 1);
      if (e.key === 'ArrowLeft') goTo(currentPage() - 1);
    });

    // Mouse drag to switch pages (touch uses native scrolling).
    let drag = null;
    viewport.addEventListener('pointerdown', e => {
      if (e.pointerType !== 'mouse' || e.button !== 0 || e.target.closest('input, button')) return;
      drag = { x: e.clientX, y: e.clientY, left: viewport.scrollLeft, active: false, dx: 0 };
    });
    viewport.addEventListener('pointermove', e => {
      if (!drag) return;
      drag.dx = e.clientX - drag.x;
      if (!drag.active) {
        if (Math.abs(drag.dx) < 10 || Math.abs(drag.dx) < Math.abs(e.clientY - drag.y)) return;
        drag.active = true;
        viewport.classList.add('dragging');
        viewport.style.scrollSnapType = 'none';
      }
      viewport.scrollLeft = drag.left - drag.dx;
    });
    const endDrag = () => {
      if (!drag) return;
      const d = drag; drag = null;
      if (!d.active) return;
      viewport.classList.remove('dragging');
      const w = viewport.clientWidth, start = Math.round(d.left / w);
      const target = Math.abs(d.dx) > w * 0.15 ? start + (d.dx < 0 ? 1 : -1) : start;
      viewport.style.scrollSnapType = '';
      goTo(target);
    };
    viewport.addEventListener('pointerup', endDrag);
    viewport.addEventListener('pointercancel', endDrag);
    // Remember the page so rotation/resizing lands on the same one instead of between two pages.
    let pageIdx = 1, resizing = false; // open on the Dock page
    viewport.addEventListener('scroll', () => {
      if (resizing) return;
      pageIdx = currentPage();
      [...$('dots').children].forEach((d, i) => d.classList.toggle('on', i === pageIdx));
    }, { passive: true });
    const resnap = () => {
      resizing = true;
      viewport.style.scrollSnapType = 'none';
      viewport.scrollLeft = pageIdx * viewport.clientWidth;
      requestAnimationFrame(() => { viewport.style.scrollSnapType = ''; viewport.scrollLeft = pageIdx * viewport.clientWidth; resizing = false; });
    };
    new ResizeObserver(resnap).observe(viewport);
    screen.orientation?.addEventListener('change', () => setTimeout(resnap, 150));

    // ------------------------------------------------------------ lifecycle
    let timers = [];
    function poll(fn, ms) {
      const tick = () => { if (authed && !document.hidden) fn().catch(() => {}); };
      tick(); timers.push(setInterval(tick, ms));
    }
    function start() {
      authed = true;
      timers.forEach(clearInterval); timers = [];
      poll(loadDock, 4000);
      poll(loadVolumes, 5000);
      poll(loadPlaces, 30000);
    }
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && authed) { loadDock().catch(() => {}); loadVolumes().catch(() => {}); loadPlaces().catch(() => {}); }
    });

    // Probe the session; fall back to the PIN prompt.
    api('/api/system').then(start).catch(() => { if (!authed) showLogin(); });
  </script>
</body>
</html>
